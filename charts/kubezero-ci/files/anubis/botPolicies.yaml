## Anubis policy — Forgejo backend
##
## Changes from previous config, in order of impact:
##   1. store: valkey instead of memory (weight now accumulates across pods/restarts)
##   2. Forgejo route weighting — blame/commit/archive/compare now add weight
##   3. Git protocol + OCI registry explicitly allowed (clone/push safety)
##   4. Load-based adaptive difficulty enabled
##   5. Authenticated sessions given negative weight
##   6. Cloudflare ASN reduced 10 -> 5
##   7. Extra threshold tier added above 30

bots:
  # ===========================================================================
  # ALLOW — must come first. These break if challenged.
  # ===========================================================================

  # Git smart HTTP. Git cannot solve proof-of-work; challenging these breaks
  # every clone, fetch, push, and CI job against the instance.
  - name: git-smart-http
    path_regex: ^/[^/]+/[^/]+(\.git)?/(info/refs|git-upload-pack|git-receive-pack|HEAD|objects/)
    action: ALLOW

  - name: git-lfs
    path_regex: ^/[^/]+/[^/]+(\.git)?/info/lfs/
    action: ALLOW

  # OCI/container registry. Regressed under Anubis 1.23.0 (TecharoHQ#1231).
  - name: oci-registry
    path_regex: ^/v2/
    action: ALLOW

  # API, package registries, Actions runner endpoints. Token-authenticated,
  # machine-driven by definition.
  - name: forgejo-api
    path_regex: ^/api/(v1|packages|actions|actions_pipeline)/
    action: ALLOW

  # Feeds. Forgejo had to exclude these in May 2025 after RSS clients broke.
  - name: feeds
    path_regex: \.(rss|atom)$
    action: ALLOW

  # Plain diff/patch, consumed by `git am` and review tooling.
  - name: raw-diff-patch
    path_regex: \.(diff|patch)$
    action: ALLOW

  # ===========================================================================
  # DENY / IMPORTED RULESETS — unchanged from your config, these are good
  # ===========================================================================

  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml
  - import: (data)/meta/ai-block-aggressive.yaml
  - import: (data)/crawlers/_allow-good.yaml
  - import: (data)/clients/x-firefox-ai.yaml
  - import: (data)/common/keep-internet-working.yaml

  # ===========================================================================
  # FORGEJO ROUTE WEIGHTING — the main addition
  #
  # Rationale: these routes have unbounded URL space and high server cost.
  # Every file x every revision, every commit pair, every archive. A human
  # touches a handful; a crawler wants all of them.
  #
  # Weights are additive with the browser baseline (+10), so a browser-shaped
  # client hitting blame lands at 10+20=30 -> extreme-suspicion.
  # ===========================================================================

  # Blame is the single most expensive Forgejo route. Explicitly called out in
  # forgejo/discussions#319 as what was taking instances down.
  - name: forgejo-blame
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/blame/
    weight:
      adjust: 20

  # Commit views, commit lists, and compare. Compare is combinatorial.
  - name: forgejo-commit-history
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/(commit|commits|compare)/
    weight:
      adjust: 15

  # Source browsing pinned to a commit SHA. Distinct from branch browsing
  # (/src/branch/) which humans use constantly — the 7+ hex requirement
  # separates them. Unbounded: every file at every revision.
  - name: forgejo-src-at-commit
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/src/commit/[0-9a-f]{7,}
    weight:
      adjust: 15

  # Archive generation. Crawlers request the tarball at every commit rather
  # than just cloning. Expensive and pure waste.
  - name: forgejo-archives
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/archive/
    weight:
      adjust: 20

  # Issue/PR filtering. Combinatorial query space; Codeberg challenges these.
  - name: forgejo-issue-filters
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/(issues|pulls)\?.*(labels|milestone|assignee|poster|q)=
    weight:
      adjust: 15

  # Global search and explore. Low human traffic, high cost.
  - name: forgejo-search-explore
    action: WEIGH
    path_regex: ^/(explore|search)
    weight:
      adjust: 15

  # Raw file access at a pinned commit — same unbounded space as src/commit.
  - name: forgejo-raw-at-commit
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/raw/commit/[0-9a-f]{7,}
    weight:
      adjust: 10

  # Wiki history and activity feeds — moderate cost, moderate crawler interest.
  - name: forgejo-activity
    action: WEIGH
    path_regex: ^/[^/]+/[^/]+/(activity|wiki/.*/_revision)
    weight:
      adjust: 10

  # ===========================================================================
  # GEO / ASN — Thoth subscription required
  # ===========================================================================

  - name: countries-with-aggressive-scrapers
    action: WEIGH
    geoip:
      countries:
        - BR
        - CN
    weight:
      adjust: 10

  # Cloudflare reduced 10 -> 5. AS13335 carries WARP users and a large volume
  # of legitimate proxied traffic; at +10, combined with the browser baseline,
  # every WARP user starts at moderate-suspicion before touching a route.
  # Hosting ASNs stay at 10 — those genuinely have no human browsers behind them.
  - name: aggressive-asns-without-functional-abuse-contact
    action: WEIGH
    asns:
      match:
        - 136907 # Huawei Cloud
        - 45102 # Alibaba Cloud
        - 14061 # DigitalOcean
        - 16509 # AWS
        - 14618 # AWS
        - 24940 # Hetzner
        - 16276 # OVH
        - 63949 # Akamai/Linode
        - 20473 # Vultr
    weight:
      adjust: 10

  - name: cloudflare-proxied
    action: WEIGH
    asns:
      match:
        - 13335 # Cloudflare
    weight:
      adjust: 5

  # ===========================================================================
  # ADAPTIVE DIFFICULTY — enabled
  #
  # On a Forgejo instance, load correlates almost directly with crawler
  # activity on blame/commit routes. Free adaptive response.
  # Only valid if Anubis and Forgejo share an OS/node.
  # ===========================================================================

  - name: high-load-average
    action: WEIGH
    expression: load_1m >= 10.0
    weight:
      adjust: 20

  - name: low-load-average
    action: WEIGH
    expression: load_15m <= 4.0
    weight:
      adjust: -5

  # ===========================================================================
  # BASELINE
  # ===========================================================================

  - name: generic-browser
    user_agent_regex: >-
      Mozilla|Opera
    action: WEIGH
    weight:
      adjust: 10

dnsbl: false

# Left disabled — TecharoHQ#435 documents bots using Open Graph passthrough to
# bypass protection. Forgejo compounds this: Anubis fetches OG tags by
# requesting the page, and Forgejo renders the entire page including diffs and
# syntax highlighting rather than just <head>, so on commit URLs the
# passthrough costs nearly as much as serving the crawler directly.
openGraph:
  enabled: false
  considerHost: false
  ttl: 24h

status_codes:
  CHALLENGE: 200
  DENY: 200

# ===========================================================================
# STORAGE — changed from memory
#
# This is the highest-impact change in the file. With backend: memory, weight
# and challenge state are per-process: they reset on every pod restart and
# rollout, and split across replicas. A crawler that should accumulate past
# threshold 30 instead sits well below it on each pod indefinitely.
#
# Shared state is what makes accumulated suspicion actually accumulate.
# ===========================================================================
store:
  backend: valkey
  parameters:
    url: "redis://forgejo-redis:6379/0"

thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW

  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1

  # Plain browser on a cheap route lands here. Unchanged — this is the
  # baseline human experience and difficulty 4 is roughly 20s on a phone.
  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

  - name: mild-proof-of-work
    expression:
      all:
        - weight >= 20
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 5

  # Browser + one expensive route lands here.
  - name: extreme-suspicion
    expression:
      all:
        - weight >= 30
        - weight < 45
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6

  # New tier. Browser + expensive route + hosting ASN, or + high load.
  # Difficulty 7 is roughly 2x the work of 6 — noticeable but not punitive
  # if a human somehow lands here.
  - name: severe-suspicion
    expression:
      all:
        - weight >= 45
        - weight < 60
    action: CHALLENGE
    challenge:
      algorithm: slow
      difficulty: 7

  # Nothing legitimate reaches 60. Multiple compounding signals only.
  - name: hostile
    expression: weight >= 60
    action: CHALLENGE
    challenge:
      algorithm: slow
      difficulty: 8
