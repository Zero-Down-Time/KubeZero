{{- if (index .Values "vector-agent" "enabled") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-agent-config
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: Agent
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      # Tails this node's pod logs, enriched with .kubernetes.* metadata.
      # Suppress pod annotations at the source so the large maps (e.g.
      # last-applied-configuration) are never allocated; pod_labels kept.
      # Source suppression silently no-ops on some versions, so drop_annotations
      # stays as the fallback and also handles namespace annotations.
      k8s:
        type: kubernetes_logs
        pod_annotation_fields:
          pod_annotations: ""
      {{- if (index .Values "vector-agent" "podMonitor" "enabled") }}
      internal_metrics:
        type: internal_metrics
      {{- end }}

    transforms:
      # Drop blank/whitespace-only lines and trim leading/trailing whitespace
      # from every remaining one, before anything else sees them.
      trim_message:
        type: remap
        inputs: [k8s]
        source: |
          msg = strip_whitespace(to_string(.message) ?? "")
          if msg == "" {
            abort
          }
          .message = msg

      # Drop unbounded annotation maps at the node (large, never indexed) to cut
      # wire/gRPC batch size. pod_labels kept (flat_object in the index template).
      drop_annotations:
        type: remap
        inputs: [trim_message]
        source: |
          del(.kubernetes.pod_annotations)
          del(.kubernetes.namespace_annotations)
      {{- if (index .Values "vector-agent" "podMonitor" "enabled") }}
      # Drop metrics emitted BY the metrics plumbing itself
      metrics_clean:
        type: filter
        inputs: [internal_metrics]
        condition: '!includes(["internal_metrics", "metrics_clean"], string(.tags.component_id) ?? "")'
      {{- end }}

      # JSON-formatted app logs (e.g. logback/log4j2 JSON layout) can contain
      # literal, unescaped newlines inside a string field (a stack trace dumped
      # into "msg" without escaping); the container runtime splits on every raw
      # newline byte, breaking one JSON object into multiple non-JSON lines.
      reduce_json:
        type: reduce
        inputs: [drop_annotations]
        group_by: [file]
        expire_after_ms: {{ index .Values "vector-agent" "reduceJson" "expireAfterMs" }}
        max_events: 200
        ends_when: 'ends_with(to_string(.message) ?? "", "}")'
        merge_strategies:
          message: concat_newline
          timestamp: discard
          kubernetes: discard

      # remove all line breaks from json in .message to allow parsing upstream
      reassemble_json:
        type: remap
        inputs: [reduce_json]
        source: |
          msg = to_string(.message) ?? ""
          if starts_with(msg, "{") {
            .message = replace(msg, "\n", "\\n")
          }

    sinks:
      # Forward to the cluster aggregator (:6000, vector protocol).
      to_aggregator:
        type: vector
        inputs: [reassemble_json]
        address: {{ .Release.Name }}-vector:6000
        acknowledgements:
          enabled: true
        request:
          concurrency: 2
        batch:
          max_events: 64
          timeout_secs: 1
        buffer:
          type: memory
          max_size: 8388608   # 8Mi
          when_full: block
      {{- if (index .Values "vector-agent" "podMonitor" "enabled") }}
      # Metrics endpoint scraped by the PodMonitor (named port prom-exporter).
      metrics:
        type: prometheus_exporter
        inputs: [metrics_clean]
        address: 0.0.0.0:9090
      {{- end }}
{{- end }}
