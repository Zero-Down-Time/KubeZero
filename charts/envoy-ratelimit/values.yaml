image:
  repository: envoyproxy/ratelimit
  # see: https://hub.docker.com/r/envoyproxy/ratelimit/tags
  tag: f2fb1577

log:
  level: warn
  format: json

# 1MB local cache for already reached limits to reduce calls to Redis
localCacheSize: 1048576

# Wether to block requests if ratelimiting is down
failureModeDeny: false

# rate limit descriptors for each domain aka. ingress class
descriptors:
  ingress:
    # remote_address + generic_key buckets — placeholders, overridden per request
    - key: remote_address
      descriptors:
        - key: generic_key
          value: per_second
          rate_limit:
            unit: second
            requests_per_unit: 1      # placeholder
        - key: generic_key
          value: per_hour
          rate_limit:
            unit: hour
            requests_per_unit: 1      # placeholder

    # JA4 bucket — placeholder, overridden per request
    - key: ja4_hash
      descriptors:
        - key: generic_key
          value: per_second
          rate_limit:
            unit: second
            requests_per_unit: 1      # placeholder
        - key: generic_key
          value: per_hour
          rate_limit:
            unit: hour
            requests_per_unit: 1      # placeholder

  privateIngress: []
# - key: sourceIp
#   value: sixtyPerMinute
#   descriptors:
#   - key: remote_address
#     rate_limit:
#       unit: minute
#       requests_per_unit: 60
# - key: sourceIp
#   value: tenPerSecond
#   descriptors:
#   - key: remote_address
#     rate_limit:
#       unit: second
#       requests_per_unit: 10
# - key: headers
#   value: 180PerMinute
#   descriptors:
#   - key: userAgent
#     rate_limit:
#       unit: minute
#       requests_per_unit: 180

metrics:
  enabled: false
